name: keep-alive
# Backup ping: wakes Render and runs SELECT 1 on Supabase so the free DB is never "inactive" for 7 days.
# (Main pinger = UptimeRobot every 5-10 min. This runs twice a day, so private repos stay inside the free minutes.)
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ secrets.BACKEND_URL }}/health/?db=1"
